<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario para registro</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body style=" background-color: rgb(141, 0, 94);">
    <div class="container"></div>
        <div class="row">
            <div class="col">
                <div class="card shadow p-4 mx-auto" style="max-width: 550px">
    <h1>Formulario para Registro</h1>
    <form action="Form.html" method="post">
        
<!--NAME-->
        <div class="mb-3">
        <label for="txtnombre" class="form-label">Nombre Completo:</label>
        <input  type="text" class="form-control"  id="txtnombre"name="txtnombre" 
            placeholder="Ej. Levi Perez">
        </div>


<!--MAIL-->
        <div class="mb-3">
        <label for="textmail" class="form-label">Correo Electrónico:</label>
        <div class="input-group">
        <span class="input-group-text">@</span>
        <input type="email" class="form-control" id="txtemail" name="txtemail" 
            placeholder="correopersonal@gmail.com" required>
            </div>
        </div>

    
<!--PHONE-->
        <div class="mb-3">
        <label for="txttel" class="form-label">Número de telefono:</label>
        <input type="tel" class="form-control" id="txttel" name="txttel" 
            pattern="[0-9]{10}" 
            placeholder="10 dígitos (Lada e identificador)">
        </div>


<!--PW-->
        <div class="mb-3">
        <label for="txtpassword" class="form-label">Ingrese su Contraseña:</label>
        <input type="password" class="form-control" id="txtpassword" name="txtpassword"
            placeholder="Mínimo 6 caracteres" required>
        </div>


<!--REPEAT-->
        <div class="mb-3">
        <label for="txtpassword" class="form-label">Confirme su Contraseña</label>
        <input type="password" class="form-control" id="txtpassword" name="txtpassword"
            placeholder="Repetir contraseña" required>
        </div>


<!--DOB-->
        <div class="mb-3">
        <label for="txtdate">Fecha de Nacimiento:</label>
        <input type="date" class="form-control" id="txtdate" name="txtdate">
        </div>


<!--GÉNERO-->
        <div class="form-check">
            <p>Género</p>
            <input type="radio" class="form-check-input" id="hombre" name="genero" value="hombre">
            <label for="hombre" class="form-check-label">Hombre</label>
        </div>
        
        <div class="form-check">
            <input type="radio" class="form-check-input" id="mujer" name="genero" value="mujer">
            <label for="mujer" class="form-check-label">Mujer</label>
        </div>

        <div class="form-check">
            <input type="radio" class="form-check-input" id="otro" name="genero" value="otro">
            <label for="otro" class="form-check-label">Otro</label>
        </div>


<!--T&C-->
        <div class="form-check mt-3 mb-3">
            <input type="checkbox" class="form-check-input" id="terminos" name="terminos" required>
            <label for="terminos" class="form-check-label">Acepto los términos y condiciones</label>
        </div>

<!--BUTTON-->
    <div class="mb-3">
        <input type="submit" class="btn btn-danger btn-lg" value="Registrar">
        </form>
                </div>
            </div>
        </div>
     </div>
</div>

  <!-- Link Regresar a Inicio -->
<a class="btn btn-success position-fixed bottom-0 end-0 m-5" href="Menu.html">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-fill" viewBox="0 0 16 16">
        <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/>
        <path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"/>
    </svg>
    Regresar a inicio
</a>
    
    <script src="js/bootstrap.min.js"></script>
</body>
</html>
